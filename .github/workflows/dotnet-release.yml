name: dotnet — release

# Tags are <lang>/vX.Y.Z (7 D2). Not a house preference: a Go module in a
# subdirectory resolves only from a tag prefixed with that subdirectory, so the
# scheme Go forces is the one every language uses.
#
# The bare 'v*' trigger is deliberately gone. The seven v0.1.0–v1.0.0 tags are
# the C# client's history and stay where they are, but leaving the trigger would
# mean a future 'v1.1.0' typo packs from paths that no longer exist — and pushes
# whatever it managed to build.
on:
  push:
    tags:
      - 'dotnet/v*'
  # Run by hand for a version whose tag already exists (the tag's own copy of this file is the one a
  # tag push or a rerun uses, so a fix to the workflow reaches an existing tag only this way).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the prefix (e.g. 1.8.1). The tag dotnet/v<version> must exist.'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Action
    permissions:
      contents: write
      id-token: write   # nuget.org Trusted Publishing: the job proves who it is with a GitHub OIDC token

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#dotnet/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore dotnet/src/InferHub.Client/InferHub.Client.csproj

      - name: Build
        run: dotnet build dotnet/src/InferHub.Client/InferHub.Client.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack dotnet/src/InferHub.Client/InferHub.Client.csproj --configuration Release --no-build --output ./nupkgs /p:Version=${{ steps.version.outputs.version }}

      # nuget.org no longer takes a long-lived API key from this repository. The job exchanges its
      # GitHub OIDC token for a key that lives one hour, under the trusted publishing policy set on
      # nuget.org for: owner Dev-Art-Solutions, repository InferHub.Clients, workflow file
      # dotnet-release.yml, environment Action. `user` is the nuget.org profile name that owns the
      # package, not an email.
      - name: NuGet login (OIDC, temporary key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER || 'iovigi' }}

      - name: Push to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dotnet/v${{ steps.version.outputs.version }}
          files: ./nupkgs/*.nupkg
          generate_release_notes: true
