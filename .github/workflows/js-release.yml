name: js — release

# Tags are <lang>/vX.Y.Z (root CLAUDE.md "Versions and tags"; python-release.yml's own comment
# applies here unchanged): a Go module in a subdirectory resolves only from a tag prefixed with
# that subdirectory, so the scheme Go requires is the one every language uses, TypeScript included.
#
# Needs an NPM_API_TOKEN secret in the "Action" environment (the one PYPI_API_TOKEN/NUGET_API_KEY
# already live in) before this can push anything — see plans/phase-19-js-core.md §5. Until that
# secret exists this workflow builds and stops at the publish step, loudly.
on:
  push:
    tags:
      - 'js/v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Action
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#js/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pin package.json version to the tag
        working-directory: js
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Install
        working-directory: js
        run: npm ci

      - name: Typecheck and test
        working-directory: js
        run: |
          npm run typecheck
          npm test

      - name: Build
        working-directory: js
        run: npm run build

      - name: Publish to npm
        working-directory: js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
