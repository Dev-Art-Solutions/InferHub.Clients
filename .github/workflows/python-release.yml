name: python — release

# Tags are <lang>/vX.Y.Z (7 D2, dotnet-release.yml's own comment applies here unchanged): a Go
# module in a subdirectory resolves only from a tag prefixed with that subdirectory, so the scheme
# Go forces is the one every language uses, Python included.
#
# Needs a PYPI_API_TOKEN secret in the "Action" environment (the one NUGET_API_KEY already lives
# in) before this can push anything — see python/CLAUDE.md or plans/phase-16-*.md for the pending
# setup step. Until that secret exists this workflow builds and stops at the push step, loudly.
on:
  push:
    tags:
      - 'python/v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Action
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#python/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pin pyproject version to the tag
        run: sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" python/pyproject.toml

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build python --outdir python/dist

      - name: Push to PyPI
        run: twine upload --non-interactive python/dist/* --skip-existing
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: python/dist/*
          generate_release_notes: true
