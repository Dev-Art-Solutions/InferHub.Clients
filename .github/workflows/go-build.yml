name: go — build and test

# Scoped to go/ so a C#, Python or TypeScript commit does not run this matrix (mirrors
# python-build.yml's and js-build.yml's own comment). spec/ and conformance/ are in the paths
# because a payload the tests read is an input to this build.
on:
  push:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'spec/**'
      - 'conformance/**'
      - '.github/workflows/go-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'spec/**'
      - 'conformance/**'
      - '.github/workflows/go-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: [ '1.22', '1.23' ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: gofmt (clean, no changes needed)
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Test
        working-directory: go
        run: go test ./...
