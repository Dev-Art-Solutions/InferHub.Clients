[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferhub-client"
version = "0.2.0"
description = "A small, typed Python client for InferHub — a self-hosted, Ollama-compatible inference mesh."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dev Art Solutions" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Dev-Art-Solutions/InferHub.Clients"
Repository = "https://github.com/Dev-Art-Solutions/InferHub.Clients"
Issues = "https://github.com/Dev-Art-Solutions/InferHub.Clients/issues"

[project.optional-dependencies]
# ruff pinned exactly, not >=: two different minor releases (0.15 -> 0.16) changed which lint
# rules are on by default with nothing in this file changed, which broke CI twice in a row on an
# unpinned version. A linter whose pass/fail depends on which version happened to install is not
# a check, so this one is deterministic instead — bump it deliberately, in its own commit, when
# there is a reason to.
test = ["pytest>=7", "pytest-asyncio>=0.23", "ruff==0.15.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/inferhub_client"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's default selection: 0.16 started enabling `I`
# (isort) by default where 0.15 did not, which broke CI on an unpinned `ruff>=0.6` the moment
# the runner picked up a newer release with nothing in this file changed. Extending the default
# set (E4, E7, E9, F) rather than replacing it.
extend-select = ["I"]
