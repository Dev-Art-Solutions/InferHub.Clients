[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferhub-client"
version = "0.1.0"
description = "A small, typed Python client for InferHub — a self-hosted, Ollama-compatible inference mesh."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dev Art Solutions" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Dev-Art-Solutions/InferHub.Clients"
Repository = "https://github.com/Dev-Art-Solutions/InferHub.Clients"
Issues = "https://github.com/Dev-Art-Solutions/InferHub.Clients/issues"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/inferhub_client"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
